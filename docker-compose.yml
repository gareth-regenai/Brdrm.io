# Local Postgres and Key Value (Redis-compatible) for development. See docs/epics/E1/DEMO.md.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boardroom
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  # A local inbox: every email the app sends lands here, nothing leaves your machine.
  # Read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]
volumes:
  pgdata:
