# Calls the real model, so it never runs on pull requests (FR-13.2).
# A drop below the threshold fails this workflow and blocks a skill release.

name: Skill evals

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill1:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_SKILL_EVALS == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install --no-deps -e .
      - name: File understanding eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evals.skill1_eval --threshold 0.9

  skill3:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_SKILL_EVALS == 'true' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && pip install --no-deps -e .
      - name: Board commentary eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m evals.skill3_eval --threshold 0.9
