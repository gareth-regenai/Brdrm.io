<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,700&display=swap">
<style>
html,body{margin:0}
body{position:relative;width:960px;height:320px;overflow:hidden;background:var(--bg);color:var(--ink)}
svg{position:absolute;left:0;top:0}
.name{position:absolute;left:40px;bottom:64px;margin:0;font:600 64px/.95 var(--font-display);letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.name i{font-style:normal;color:var(--ink-muted)}
.tag{position:absolute;left:40px;bottom:36px;margin:0;font:400 14px/20px var(--font-sans);color:var(--ink-muted)}
.navy{fill:var(--brand-fill)}.seatband{fill:var(--chart-2)}.coralblk{fill:var(--accent)}.brickblk{fill:var(--risk-3)}
.table{fill:var(--bg)}.seat{fill:var(--chart-2)}.seat-hot{fill:var(--accent);stroke:var(--bg);stroke-width:3}
</style></head><body>
<svg width="960" height="320" viewBox="0 0 960 320" aria-hidden="true">
<!--
Blocks: deep-ocean slab (brand-fill, 240x336), seat-grey band (244x104), coral slab (124x232), brick block (112x100): about 45% of the cover, 8px gaps, bleeding off top, right and bottom.
Pattern: the round board table seen from above, cut from the slab in the ground colour with twelve seats, eleven seat-grey and one coral for the approver.
Corners are 3px, as in the product.
-->
<rect class="navy" x="480" y="-8" width="240" height="336" rx="3"/>
<rect class="seatband" x="728" y="-8" width="244" height="104" rx="3"/>
<rect class="coralblk" x="728" y="104" width="124" height="232" rx="3"/>
<rect class="brickblk" x="860" y="104" width="112" height="100" rx="3"/>
<circle class="table" cx="600" cy="160" r="70"/>
<circle class="seat-hot" cx="600.0" cy="56.0" r="10"/>
<circle class="seat" cx="652.0" cy="69.9" r="10"/>
<circle class="seat" cx="690.1" cy="108.0" r="10"/>
<circle class="seat" cx="704.0" cy="160.0" r="10"/>
<circle class="seat" cx="690.1" cy="212.0" r="10"/>
<circle class="seat" cx="652.0" cy="250.1" r="10"/>
<circle class="seat" cx="600.0" cy="264.0" r="10"/>
<circle class="seat" cx="548.0" cy="250.1" r="10"/>
<circle class="seat" cx="509.9" cy="212.0" r="10"/>
<circle class="seat" cx="496.0" cy="160.0" r="10"/>
<circle class="seat" cx="509.9" cy="108.0" r="10"/>
<circle class="seat" cx="548.0" cy="69.9" r="10"/>
</svg>
<h1 class="name">BoardRoom<i>.io</i></h1>
<p class="tag">Board packs built from the numbers your team already has.</p>
</body></html>
