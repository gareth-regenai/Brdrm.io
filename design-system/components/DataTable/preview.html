<!-- @dsCard group="Data" height=300 subtitle="Actual against plan, one row per metric" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,700&display=swap">
<style>
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/23px var(--font-sans);padding:var(--space-5)}
*{box-sizing:border-box}
[class]{corner-shape:bevel}
.cap{font:700 11px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 var(--space-2)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;margin-bottom:var(--space-5)}
.note{font:400 13px/18px var(--font-sans);color:var(--ink-muted);margin:var(--space-3) 0 0}
table{border-collapse:collapse;width:100%;max-width:760px;background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);font-size:14px}
th{font:700 11px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);text-align:right;padding:8px 10px;border-bottom:1.5px solid var(--border)}
th:first-child,td:first-child{text-align:left}
td{padding:10px;text-align:right;border-bottom:1px solid var(--border-subtle);font-variant-numeric:tabular-nums}
td:first-child{font-weight:700}
.off{color:var(--accent-ink);font-weight:700}
.pill{display:inline-block;font:700 11px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:var(--radius-sm)}
.ok{background:var(--ok-bg);color:var(--ok)}
.bad{background:var(--err-bg);color:var(--err)}
</style></head><body>
<table><thead><tr><th>Metric</th><th>Actual</th><th>Plan</th><th>Variance</th><th>Status</th></tr></thead><tbody>
<tr><td>Revenue Q3</td><td>£302.9k</td><td>£315.0k</td><td class="off">−3.8%</td><td><span class="pill bad">Off plan</span></td></tr>
<tr><td>Monthly burn</td><td>£78.1k</td><td>£70.3k</td><td class="off">+11.1%</td><td><span class="pill bad">Off plan</span></td></tr>
<tr><td>Gross margin</td><td>85.3%</td><td>85.0%</td><td>+0.3 pts</td><td><span class="pill ok">On plan</span></td></tr>
<tr><td>Tech points</td><td>351</td><td>430</td><td>−18.4%</td><td><span class="pill bad">Off plan</span></td></tr></tbody></table>
<p class="note">Sample figures, Kestrel Field Ltd.</p>
</body></html>
