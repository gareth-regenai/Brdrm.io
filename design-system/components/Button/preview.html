<!-- @dsCard group="Actions" height=250 subtitle="Primary, secondary, danger, small" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,700&display=swap">
<style>
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/23px var(--font-sans);padding:var(--space-5)}
*{box-sizing:border-box}
[class]{corner-shape:bevel}
.cap{font:700 11px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 var(--space-2)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;margin-bottom:var(--space-5)}
.note{font:400 13px/18px var(--font-sans);color:var(--ink-muted);margin:var(--space-3) 0 0}
.btn{font:700 15px/22px var(--font-sans);padding:10px 18px;border-radius:var(--radius-md);border:1px solid var(--border-strong);background:transparent;color:var(--ink);cursor:pointer}
.btn.sm{font-size:13px;padding:6px 12px;border-radius:var(--radius-sm)}
.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.danger{border-color:var(--accent-ink);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.focus,.btn:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}
</style></head><body>
<p class="cap">Default</p>
<div class="row"><button class="btn primary">Approve cycle and push to investors</button><button class="btn">Request changes</button><button class="btn danger">Revoke access</button><button class="btn sm">Invite someone</button></div>
<p class="cap">Focus and disabled</p>
<div class="row"><button class="btn primary focus">Submit for approval</button><button class="btn focus">Confirm mapping</button><button class="btn primary" disabled>Submit for approval</button></div>
</body></html>
