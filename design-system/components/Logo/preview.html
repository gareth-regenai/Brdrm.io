<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,700&display=swap">
<style>
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/23px var(--font-sans);padding:var(--space-5)}
*{box-sizing:border-box}
[class]{corner-shape:bevel}
.cap{font:700 11px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 var(--space-2)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;margin-bottom:var(--space-5)}
.note{font:400 13px/18px var(--font-sans);color:var(--ink-muted);margin:var(--space-3) 0 0}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.p{border-radius:var(--radius-md);padding:var(--space-6) var(--space-5);display:flex;align-items:center;gap:var(--space-3)}
.l{background:#FFFFFF;border:1px solid #D4DFE2}
.d{background:#131516;border:1px solid #2A2E31}
.wm{font:600 30px/32px var(--font-display);letter-spacing:-.01em}
.l .wm{color:#123C4A}.l .wm i{color:#4C6B76}
.d .wm{color:#FFFFFF}.d .wm i{color:#C3CBCE}
.wm i{font-style:normal}
</style></head><body>
<div class="panels"><div class="p l"><svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="16" fill="#123C4A"/><circle cx="32" cy="7" r="6.2" fill="#E0613C"/><circle cx="53.65" cy="19.5" r="6.2" fill="#8AA0A8"/><circle cx="53.65" cy="44.5" r="6.2" fill="#8AA0A8"/><circle cx="32" cy="57" r="6.2" fill="#8AA0A8"/><circle cx="10.35" cy="44.5" r="6.2" fill="#8AA0A8"/><circle cx="10.35" cy="19.5" r="6.2" fill="#8AA0A8"/></svg><span class="wm">BoardRoom<i>.io</i></span></div><div class="p d"><svg width="48" height="48" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="16" fill="#FFFFFF"/><circle cx="32" cy="7" r="6.2" fill="#F4AB93"/><circle cx="53.65" cy="19.5" r="6.2" fill="#9AA4A9"/><circle cx="53.65" cy="44.5" r="6.2" fill="#9AA4A9"/><circle cx="32" cy="57" r="6.2" fill="#9AA4A9"/><circle cx="10.35" cy="44.5" r="6.2" fill="#9AA4A9"/><circle cx="10.35" cy="19.5" r="6.2" fill="#9AA4A9"/></svg><span class="wm">BoardRoom<i>.io</i></span></div></div>
<p class="note">Clear space: one seat diameter on every side. Minimum mark size 20px.</p>
</body></html>
