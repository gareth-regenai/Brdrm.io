<!-- @dsCard group="Status" height=190 subtitle="Five statuses, tint fill, word always shown" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,700&display=swap">
<style>
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/23px var(--font-sans);padding:var(--space-5)}
*{box-sizing:border-box}
[class]{corner-shape:bevel}
.cap{font:700 11px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 var(--space-2)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;margin-bottom:var(--space-5)}
.note{font:400 13px/18px var(--font-sans);color:var(--ink-muted);margin:var(--space-3) 0 0}
.pill{display:inline-block;font:700 11px/16px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:var(--radius-sm);background:var(--bg);color:var(--ink-muted)}
.surf{background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);display:inline-flex;gap:var(--space-3);flex-wrap:wrap}
.surf .draft{background:var(--border-subtle)}
.review{background:var(--info-bg);color:var(--info)}
.approved{background:var(--ok);color:var(--on-ok)}
.published{background:var(--ok-bg);color:var(--ok)}
.off{background:var(--err-bg);color:var(--err)}
</style></head><body>
<div class="surf"><span class="pill draft">Draft</span><span class="pill review">In review</span><span class="pill approved">Approved</span><span class="pill published">Published</span><span class="pill off">Off plan</span></div>
<p class="note" style="max-width:520px">Every status shows its word, so none depends on colour. Only Off plan is brick.</p>
</body></html>
